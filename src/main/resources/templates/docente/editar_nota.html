<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/docente/inicio">📚 Panel Docente</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-white">
                    <h4>✏️ Editar Nota</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/docente/notas/actualizar/{id}(id=${nota.id})}" method="post">
                        <div class="mb-3">
                            <label>Alumno</label>
                            <input type="text" class="form-control" th:value="${nota.alumno.nombre}" disabled>
                        </div>
                        <div class="mb-3">
                            <label>Materia</label>
                            <input type="text" class="form-control" th:value="${nota.materia.nombre}" disabled>
                        </div>
                        <div class="mb-3">
                            <label>Corte</label>
                            <select name="corte" class="form-select" required>
                                <option th:each="c : ${cortes}" th:value="${c}" th:selected="${c == nota.corte}" th:text="${c}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Nota (0-10)</label>
                            <input type="number" step="0.1" name="notaValor" class="form-control" th:value="${nota.nota}" min="0" max="10" required>
                        </div>
                        <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
                        <a href="/docente/notas/lista" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
