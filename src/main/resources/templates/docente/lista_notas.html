<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/docente/inicio">📚 Panel Docente</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Lista de Notas</h2>
        <a href="/docente/notas" class="btn btn-primary">➕ Registrar Nueva Nota</a>
        <a href="/docente/inicio" class="btn btn-secondary">Volver al Dashboard</a>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead>
                <tr>
                    <th>Alumno</th>
                    <th>Materia</th>
                    <th>Corte</th>
                    <th>Nota</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="nota : ${notas}">
                    <td th:text="${nota.alumno.nombre}"></td>
                    <td th:text="${nota.materia.nombre}"></td>
                    <td th:text="${nota.corte}"></td>
                    <td th:text="${nota.nota}"></td>
                    <td th:text="${#temporals.format(nota.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/docente/notas/editar/{id}(id=${nota.id})}" class="btn btn-warning btn-sm">✏️ Editar</a>
                        <a th:href="@{/docente/notas/eliminar/{id}(id=${nota.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta nota?')">🗑️ Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${notas.isEmpty()}">
                    <td colspan="6" class="text-center">No hay notas registradas aún.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
